name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release --base-href /s3-browser/

      # Pages used to Jekyll-render PRIVACY_POLICY.md from the branch, and
      # /PRIVACY_POLICY is linked externally, so keep publishing it. Pages
      # serves the extensionless URL from the .html file.
      - name: Render privacy policy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
          pandoc PRIVACY_POLICY.md --standalone \
            --metadata pagetitle="Privacy Policy - S3 Browser" \
            -o build/web/PRIVACY_POLICY.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
